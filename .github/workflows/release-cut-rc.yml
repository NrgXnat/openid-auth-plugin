name: Release - Cut RC Branch

# Cuts an RC branch from `source_branch` (default: develop) and bumps
# source_branch to the next dev version. Plugin variant of the monorepo
# release-cut-rc workflow — no dicom-edit6 bump; version lives in
# build.gradle (groovy DSL: `version "..."`).
#
# Inputs:
#   next_dev_version - version source_branch should become after cutting
#                       (e.g. 1.7.0-SNAPSHOT, MUST end with -SNAPSHOT)
#   source_branch    - branch to cut from (default: develop)
#
# Produces:
#   - new branch releases/<release>-rc with version "<release>-RC-SNAPSHOT"
#   - source_branch with version "<next_dev_version>"

on:
  workflow_dispatch:
    inputs:
      next_dev_version:
        description: 'Next develop SNAPSHOT version (e.g. 1.7.0-SNAPSHOT)'
        type: string
        required: true
      source_branch:
        description: 'Branch to cut from (default: develop)'
        type: string
        required: false
        default: develop
      trigger_build:
        description: 'After cut, dispatch build/publish on RC and source_branch'
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  actions:  write   # dispatch build-publish workflow

jobs:
  cut-rc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ${{ inputs.source_branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read current state and derive versions
        id: vars
        run: |
          set -euo pipefail

          # Groovy DSL: `version "1.6.0-SNAPSHOT"`
          CURRENT_VERSION="$(grep -E '^version ' build.gradle | head -n1 | sed -E 's/^version "(.+)"$/\1/')"
          if [[ -z "${CURRENT_VERSION}" ]]; then
            echo "::error::Could not read version from build.gradle"
            exit 1
          fi

          RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
          RC_VERSION="${RELEASE_VERSION}-RC-SNAPSHOT"
          RC_BRANCH="releases/${RELEASE_VERSION}-rc"

          {
            echo "current_version=${CURRENT_VERSION}"
            echo "release_version=${RELEASE_VERSION}"
            echo "rc_version=${RC_VERSION}"
            echo "rc_branch=${RC_BRANCH}"
          } >> "$GITHUB_OUTPUT"

          echo "::notice::source=${{ inputs.source_branch }} current=${CURRENT_VERSION} → rc=${RC_VERSION} branch=${RC_BRANCH}"

      - name: Validate
        env:
          NEXT_DEV_VERSION: ${{ inputs.next_dev_version }}
          CURRENT_VERSION:  ${{ steps.vars.outputs.current_version }}
          RC_BRANCH:        ${{ steps.vars.outputs.rc_branch }}
        run: |
          set -euo pipefail

          if [[ "${CURRENT_VERSION}" != *-SNAPSHOT ]]; then
            echo "::error::source_branch is on ${CURRENT_VERSION}; expected -SNAPSHOT. Refusing to cut RC from a release/RC branch."
            exit 1
          fi
          if [[ "${NEXT_DEV_VERSION}" != *-SNAPSHOT ]]; then
            echo "::error::next_dev_version=${NEXT_DEV_VERSION} must end with -SNAPSHOT"
            exit 1
          fi
          if [[ "${NEXT_DEV_VERSION}" == "${CURRENT_VERSION}" ]]; then
            echo "::error::next_dev_version equals current version (${CURRENT_VERSION}); nothing to bump"
            exit 1
          fi
          if git ls-remote --exit-code origin "refs/heads/${RC_BRANCH}" >/dev/null 2>&1; then
            echo "::error::RC branch ${RC_BRANCH} already exists on origin"
            exit 1
          fi

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Cut RC branch
        env:
          CURRENT_VERSION:  ${{ steps.vars.outputs.current_version }}
          RELEASE_VERSION:  ${{ steps.vars.outputs.release_version }}
          RC_VERSION:       ${{ steps.vars.outputs.rc_version }}
          RC_BRANCH:        ${{ steps.vars.outputs.rc_branch }}
        run: |
          set -euo pipefail

          git switch -c "${RC_BRANCH}"

          sed -i "s|^version \"${CURRENT_VERSION}\"\$|version \"${RC_VERSION}\"|" build.gradle
          grep -E '^version ' build.gradle
          git add build.gradle

          git commit -m "chore(release): cut RC for ${RELEASE_VERSION}"
          git push -u origin "${RC_BRANCH}"

      - name: Bump source_branch to next dev version
        env:
          SOURCE_BRANCH:    ${{ inputs.source_branch }}
          CURRENT_VERSION:  ${{ steps.vars.outputs.current_version }}
          NEXT_DEV_VERSION: ${{ inputs.next_dev_version }}
          RELEASE_VERSION:  ${{ steps.vars.outputs.release_version }}
        run: |
          set -euo pipefail

          git switch "${SOURCE_BRANCH}"

          sed -i "s|^version \"${CURRENT_VERSION}\"\$|version \"${NEXT_DEV_VERSION}\"|" build.gradle
          grep -E '^version ' build.gradle

          git add build.gradle
          git commit -m "chore(release): bump ${SOURCE_BRANCH} to ${NEXT_DEV_VERSION} after cutting ${RELEASE_VERSION}-rc"
          git push origin "${SOURCE_BRANCH}"

      - name: Trigger build/publish on RC branch and source_branch
        if: ${{ inputs.trigger_build }}
        env:
          GH_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          REPO:          ${{ github.repository }}
          RC_BRANCH:     ${{ steps.vars.outputs.rc_branch }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          set -euo pipefail

          echo "::group::Dispatch build-publish on RC branch (${RC_BRANCH})"
          gh workflow run build-publish.yml --repo "${REPO}" \
            --ref "${RC_BRANCH}" \
            -f publish_jfrog=true
          echo "::endgroup::"

          echo "::group::Dispatch build-publish on source_branch (${SOURCE_BRANCH})"
          gh workflow run build-publish.yml --repo "${REPO}" \
            --ref "${SOURCE_BRANCH}" \
            -f publish_jfrog=true
          echo "::endgroup::"

      - name: Job summary
        env:
          SOURCE_BRANCH:    ${{ inputs.source_branch }}
          NEXT_DEV_VERSION: ${{ inputs.next_dev_version }}
          RC_BRANCH:        ${{ steps.vars.outputs.rc_branch }}
          RC_VERSION:       ${{ steps.vars.outputs.rc_version }}
          RELEASE_VERSION:  ${{ steps.vars.outputs.release_version }}
          SERVER_URL:       ${{ github.server_url }}
          REPOSITORY:       ${{ github.repository }}
        run: |
          {
            echo "## Release RC cut: ${RELEASE_VERSION}"
            echo ""
            echo "**RC branch**: [\`${RC_BRANCH}\`](${SERVER_URL}/${REPOSITORY}/tree/${RC_BRANCH})"
            echo ""
            echo "| file | value |"
            echo "|------|-------|"
            echo "| \`build.gradle\` version | \`${RC_VERSION}\` |"
            echo ""
            echo "**${SOURCE_BRANCH}** bumped to: \`${NEXT_DEV_VERSION}\`"
            echo ""
            echo "### Next step"
            echo "Stabilize on \`${RC_BRANCH}\`; when ready, dispatch the release-promote workflow."
          } >> "$GITHUB_STEP_SUMMARY"
