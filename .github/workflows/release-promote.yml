name: Release - Promote RC to Main

# Promotes a stabilized RC branch to a tagged release on main.
# Plugin variant of the monorepo release-promote workflow — no
# dicom-edit6 sync; version lives in build.gradle (groovy DSL: `version "..."`).
#
# Inputs:
#   rc_branch        - RC branch to promote (e.g. releases/1.6.0-rc); REQUIRED
#   target_main      - branch to merge into (default main)
#   trigger_build    - dispatch build/publish on target_main
#
# Produces:
#   - RC branch with -RC-SNAPSHOT suffix stripped (release version string)
#   - target_main fast-merged (--no-ff) with RC + tag <RELEASE_VERSION> (no v prefix)

on:
  workflow_dispatch:
    inputs:
      rc_branch:
        description: 'RC branch to promote (e.g. releases/1.6.0-rc)'
        type: string
        required: true
      target_main:
        description: 'Branch to merge into (default main)'
        type: string
        required: false
        default: main
      trigger_build:
        description: 'After promote, dispatch build/publish on target_main'
        type: boolean
        required: false
        default: true

permissions:
  contents: write   # push RC/main + create tag
  actions:  write   # dispatch build-publish workflow

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ${{ inputs.rc_branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rc_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read RC state and derive release version
        id: vars
        env:
          RC_BRANCH: ${{ inputs.rc_branch }}
        run: |
          set -euo pipefail

          RC_VERSION="$(grep -E '^version ' build.gradle | head -n1 | sed -E 's/^version "(.+)"$/\1/')"
          if [[ -z "${RC_VERSION}" ]]; then
            echo "::error::Could not read version from build.gradle"
            exit 1
          fi
          RELEASE_VERSION="${RC_VERSION%-RC-SNAPSHOT}"

          {
            echo "rc_version=${RC_VERSION}"
            echo "release_version=${RELEASE_VERSION}"
          } >> "$GITHUB_OUTPUT"

          echo "::notice::rc=${RC_BRANCH} rc_version=${RC_VERSION} → release=${RELEASE_VERSION}"

      - name: Validate
        env:
          RC_BRANCH:        ${{ inputs.rc_branch }}
          RC_VERSION:       ${{ steps.vars.outputs.rc_version }}
          RELEASE_VERSION:  ${{ steps.vars.outputs.release_version }}
        run: |
          set -euo pipefail

          if [[ ! "${RC_BRANCH}" =~ ^releases/.+-rc$ ]]; then
            echo "::error::rc_branch=${RC_BRANCH} must match 'releases/*-rc'"
            exit 1
          fi
          if [[ "${RC_VERSION}" != *-RC-SNAPSHOT ]]; then
            echo "::error::RC branch version=${RC_VERSION} must end with -RC-SNAPSHOT"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag ${RELEASE_VERSION} already exists on origin"
            exit 1
          fi

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Finalize RC branch (strip -RC-SNAPSHOT)
        env:
          RC_BRANCH:        ${{ inputs.rc_branch }}
          RC_VERSION:       ${{ steps.vars.outputs.rc_version }}
          RELEASE_VERSION:  ${{ steps.vars.outputs.release_version }}
        run: |
          set -euo pipefail

          sed -i "s|^version \"${RC_VERSION}\"\$|version \"${RELEASE_VERSION}\"|" build.gradle
          grep -E '^version ' build.gradle
          git add build.gradle

          git commit -m "chore(release): finalize ${RELEASE_VERSION}"
          git push origin "HEAD:${RC_BRANCH}"

      - name: Merge RC into target_main and tag
        env:
          RC_BRANCH:        ${{ inputs.rc_branch }}
          TARGET_MAIN:      ${{ inputs.target_main }}
          RELEASE_VERSION:  ${{ steps.vars.outputs.release_version }}
        run: |
          set -euo pipefail

          git fetch origin "${TARGET_MAIN}"
          git switch "${TARGET_MAIN}"
          git pull --ff-only origin "${TARGET_MAIN}"

          # --no-ff to create an explicit merge commit on release boundary;
          # set -e + no -X strategy → fail fast on conflict (release manager intervenes)
          git merge --no-ff "origin/${RC_BRANCH}" -m "release: ${RELEASE_VERSION}"

          git tag "${RELEASE_VERSION}"   # no 'v' prefix (matches monorepo tag convention)
          git push origin "${TARGET_MAIN}"
          git push origin "refs/tags/${RELEASE_VERSION}"

      - name: Trigger build/publish on target_main
        if: ${{ inputs.trigger_build }}
        env:
          GH_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
          REPO:        ${{ github.repository }}
          TARGET_MAIN: ${{ inputs.target_main }}
        run: |
          set -euo pipefail

          echo "::group::Dispatch build-publish on target_main (${TARGET_MAIN})"
          gh workflow run build-publish.yml --repo "${REPO}" \
            --ref "${TARGET_MAIN}" \
            -f publish_jfrog=true
          echo "::endgroup::"

      - name: Job summary
        env:
          RC_BRANCH:        ${{ inputs.rc_branch }}
          TARGET_MAIN:      ${{ inputs.target_main }}
          RELEASE_VERSION:  ${{ steps.vars.outputs.release_version }}
          SERVER_URL:       ${{ github.server_url }}
          REPOSITORY:       ${{ github.repository }}
        run: |
          {
            echo "## Release promoted: ${RELEASE_VERSION}"
            echo ""
            echo "**Tag**: [\`${RELEASE_VERSION}\`](${SERVER_URL}/${REPOSITORY}/releases/tag/${RELEASE_VERSION})"
            echo "**${TARGET_MAIN}**: [HEAD](${SERVER_URL}/${REPOSITORY}/tree/${TARGET_MAIN})"
            echo "**${RC_BRANCH}**: kept (finalized to release strings; available for future patches)"
            echo ""
            echo "| file | value |"
            echo "|------|-------|"
            echo "| \`build.gradle\` version | \`${RELEASE_VERSION}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
