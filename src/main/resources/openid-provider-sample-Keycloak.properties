#
# xnat-openid-auth-plugin: openid-provider-sample-keycloak.properties
#
# Copy to $XNAT_HOME/config/auth as 'openid-provider.properties'
#
#
# Needs to be 'openid'
auth.method=openid
type=openid
provider.id=keycloak

# Set to true to automatically enable new users (allow immediate login), false to require admin approval
auto.enabled=true
# Set to true to automatically verify new users, false to require email/admin verification
auto.verified=true
# Name displayed in the UI
name=KeyCloak
# Site URL - the main domain, needed to build the pre-established URL below.
siteUrl=
preEstablishedRedirUri=/openid-login

# Obtained when registering your app in keycloak
openid.keycloak.clientId=XNAT
openid.keycloak.clientSecret=
openid.keycloak.accessTokenUri=http://localhost:8082/realms/master/protocol/openid-connect/token
openid.keycloak.userAuthUri=http://localhost:8082/realms/master/protocol/openid-connect/auth
openid.keycloak.userInfoUri=http://localhost:8082/realms/master/protocol/openid-connect/userinfo
openid.keycloak.scopes=openid,profile,email
openid.keycloak.link=<p>To sign-in using your keycloak credentials, please click on the button below.</p></p><p><a href="/openid-login?providerId=keycloak"> <img src="/images/btn_keycloak_signin_dark_normal_web.png" /> </a></p>

# Flag that sets if we should be checking email domains
openid.keycloak.shouldFilterEmailDomains=false

# Flag that sets if XNAT Project permissions will be managed as OAuth Claim Entitlements
openid.aaf.xnatProjectAuthorizations=false

# Flag to force the user creation process, normally this should be set to false
openid.keycloak.forceUserCreate=true

# Property names to use when creating users
openid.keycloak.emailProperty=email
openid.keycloak.givenNameProperty=given_name
openid.keycloak.familyNameProperty=family_name

# Flag to enable the PKCE support
openid.keycloak.pkceEnabled=true

# Default username pattern for the auth_user field of the xhbm_xdat_user_auth table
openid.keycloak.usernamePattern=[providerId]-[sub]

# Terms of Service and Privacy Policy file paths relative to $XNAT_HOME
openid.tos=config/auth/legal/terms-of-service.html
openid.privacyPolicy=config/auth/legal/privacy-policy.html

# ID Token encryption algorithm.
# Only RSA algorithms are currently supported (RSA1_5, RSA-OAEP, RSA-OAEP-256, RSA-OAEP-384, RSA-OAEP-512).
#
# Keys are automatically persisted to the XNAT database and shared across all nodes in load-balanced
# environments. Keys are generated on first startup and reused on subsequent restarts.
# Backup recommendation: Include XNAT database backups to preserve encryption keys.
openid.keycloak.idTokenEncryptionAlgorithm=RSA-OAEP-256