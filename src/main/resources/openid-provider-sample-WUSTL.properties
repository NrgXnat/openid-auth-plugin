#
# xnat-openid-auth-plugin: openid-provider-sample-Google.properties
#
# Copy to $XNAT_HOME/config/auth as 'openid-provider.properties'
# 
#
# Needs to be 'openid'
auth.method=openid
type=openid
provider.id=openid
# Set to true to automatically enable new users (allow immediate login), false to require admin approval
auto.enabled=true
# Set to true to automatically verify new users, false to require email/admin verification
auto.verified=true
# Name displayed in the UI
name=OpenID Authentication Provider
# Site URL - the main domain, needed to build the pre-established URL below.
siteUrl=
preEstablishedRedirUri=/openid-login
# Obtained when registering your app in WUSTL authorization server
openid.wustl.clientId=
openid.wustl.clientSecret=
openid.wustl.accessTokenUri=https://is-login.wustl.edu/connect/token
openid.wustl.userInfoUri=https://is-login.wustl.edu/connect/userinfo
openid.wustl.userAuthUri=https://is-login.wustl.edu/connect/authorize
openid.wustl.scopes=openid,profile,email
openid.wustl.link=<p>To sign-in using your WUSTL Key, please click on the button below.</p></p><p><a href="/openid-login?providerId=wustl"> <img src="/images/wustl-connect-banner.png" /> </a></p>
# Flag that sets if we should be checking email domains
openid.wustl.shouldFilterEmailDomains=false
# Flag to force the user creation process, normally this should be set to false
openid.wustl.forceUserCreate=true
# Property names to use when creating users
openid.wustl.emailProperty=email
openid.wustl.givenNameProperty=given_name
openid.wustl.familyNameProperty=family_name
# Flag to enable the PKCE support
openid.wustl.pkceEnabled=true
# Default username pattern for the auth_user field of the xhbm_xdat_user_auth table
openid.wustl.usernamePattern=[providerId]-[sub]

# --- Bearer-token authentication (REST clients sending 'Authorization: Bearer <jwt>') — opt-in, off by default ---
openid.wustl.bearer.enabled=true
# Expected 'iss' and the provider's JWKS endpoint (both required when bearer.enabled=true)
openid.wustl.issuer=https://is-login.wustl.edu
openid.wustl.jwksUri=https://is-login.wustl.edu/.well-known/openid-configuration/jwks

# --- Claim-validation gates (audience + role), opt-in per path ---
# What to check (shared): the single audience XNAT accepts, plus the roles claim path and the required role
openid.wustl.audCheck.acceptedAudiences=xnat
openid.wustl.roleCheck.rolePath=resource_access.xnat.roles
openid.wustl.roleCheck.requiredRoles=xnat_access
# Whether to check, per path (idToken = interactive login, bearer = REST); bearer audCheck defaults on, the rest default off
openid.wustl.idToken.roleCheck.enabled=true
openid.wustl.bearer.audCheck.enabled=true
openid.wustl.bearer.roleCheck.enabled=true
# Optional per-path override example: read bearer roles from a different claim than the interactive path
#openid.wustl.bearer.roleCheck.rolePath=realm_access.roles

# --- Type gate: reject a token of the wrong kind (e.g. an id token replayed as a bearer credential) ---
# RFC 9068 / IdentityServer sets 'typ' in the JWT HEADER: "at+jwt" on access tokens, "JWT" on id tokens.
# Enable once (applies to both paths); set the expected value PER PATH since it differs by path.
openid.wustl.typCheck.enabled=true
openid.wustl.bearer.typCheck.expectedTypes=at+jwt
openid.wustl.idToken.typCheck.expectedTypes=JWT
