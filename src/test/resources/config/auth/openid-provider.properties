auth.method=openid
type=openid
provider.id=test
visible=true
# Set to true to automatically enable new users (allow immediate login), false to require admin approval
auto.enabled=true
# Set to true to automatically verify new users, false to require email/admin verification
auto.verified=true
name=OpenID Authentication Provider
disableUsernamePasswordLogin=false
enabled=test
siteUrl=http://localhost:8081
preEstablishedRedirUri=/openid-login

openid.test.clientId=test
openid.test.clientSecret=secret
openid.test.accessTokenUri=http://localhost:8081/token
openid.test.userAuthUri=http://localhost:8081/auth
openid.test.userInfoUri=http://localhost:8081/userinfo
openid.test.pkceEnabled=true
openid.test.scopes=openid,profile,email
openid.test.link=<span>login</span>
openid.test.shouldFilterEmailDomains=false
openid.test.forceUserCreate=false
openid.test.emailProperty=email
openid.test.givenNameProperty=given_name
openid.test.familyNameProperty=family_name
